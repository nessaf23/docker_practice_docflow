version: '3.8'

services:
 
  image-compress:
    build:
      context: .
      dockerfile: image-compress/Dockerfile
    environment:
      - COMPRESS_RATIO=10  
    volumes:
      - images_data:/app/data # Общий том (скорректируйте путь внутри контейнера под ваш код)
    expose:
      - "18080"

  # Сервер раздачи картинок
  image-serve:
    build:
      context: .
      dockerfile: image-serve/Dockerfile
    volumes:
      - images_data:/app/data 
    expose:
      - "18080"

  
  proxy:
    image: nginx:1.25-alpine
    ports:
      - "18080:18080" 
    volumes:
      
      - ./proxy/conf.d/image-serv.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - image-compress
      - image-serve


volumes:
  images_data:

