services:
  image-compress:
    build: ./image-compress
    init: true
    environment:
      - COMPRESS_RATIO=10
      - IMAGE_PATH=/data/images
    volumes:
      - images_data:/data/images
    expose:
      - "18080"

  image-serve:
    build: ./image-serve
    init: true
    volumes:
      - images_data:/data/images:ro
    expose:
      - "18080"

  proxy:
    image: nginx:1.25.5-alpine
    ports:
      - "18080:18080"
    volumes:
      - ./proxy/conf.d/image-serv.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - image-compress
      - image-serve

volumes:
  images_data:
